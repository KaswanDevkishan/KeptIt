services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keptit}
      POSTGRES_USER: ${POSTGRES_USER:-keptit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keptit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - keptit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keptit_postgres_data:
